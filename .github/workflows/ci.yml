# Standard tacular-omics CI. Canonical copy: tacular-omics workspace templates/.
# Package-specific jobs (docs, paper, extras matrices) live in separate workflow
# files or are appended below the standard jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests
        env:
          UNIPROTPTMPY_EXPECT_EXTRAS: server,link

  # Proves the declared lower bounds still work: installs the oldest allowed
  # version of every direct dependency.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      # --no-sync is required: a plain `uv run` re-resolves to the default (highest)
      # versions and silently undoes the lowest-direct sync above.
      - run: uv run --no-sync pytest tests
        env:
          UNIPROTPTMPY_EXPECT_EXTRAS: server,link

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Import the built wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('${{ github.workspace }}/pyproject.toml','rb'))['project']['name'].replace('-','_'))")
          uv run --isolated --no-project --with "$(ls ${{ github.workspace }}/dist/*.whl)" python -c "import $pkg; print($pkg.__version__)"
      - name: Check the bundled UniProt PTM list data files made it into the wheel
        run: |
          python -c "
          import glob, sys, zipfile
          for wheel in glob.glob('dist/*.whl'):
              names = zipfile.ZipFile(wheel).namelist()
              for required in ('ptmlist.txt', 'ptmlist.tsv'):
                  if not any(n.endswith(required) for n in names):
                      sys.exit(f'{wheel} is missing the bundled {required} data file')
              print(wheel, [n for n in names if n.endswith(('.txt', '.tsv'))])
          "

  # Package-specific: branch coverage uploaded to Codecov. Report only, no threshold.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
        env:
          UNIPROTPTMPY_EXPECT_EXTRAS: server,link
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/uniprotptmpy
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/uniprotptmpy
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # Same hooks contributors run at commit time (.pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # Package-specific: the environment `pip install uniprotptmpy` produces. The core
  # package declares no runtime dependencies, and every job above installs --all-extras,
  # so without this one nothing any developer or any job runs ever enters it.
  no-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      # No --all-extras: the dev group only, which is what `uv sync` alone gives a
      # contributor. --no-sync on the run, or uv re-resolves and undoes it.
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync pytest tests
        env:
          UNIPROTPTMPY_EXPECT_EXTRAS: none

  # Package-specific: the Vercel deploy surface (vercel.json + api/index.py). Until this job
  # existed, the only thing that had ever installed what vercel.json says to install, or
  # imported the entry point, was a Vercel build - a third-party check row, optional in our
  # merge gate, which a fork pull request cannot produce at all until the repository owner
  # authorises that one pull request by hand. Nothing here talks to Vercel or to any
  # deployment: it runs the same install locally. The environment comes from `installCommand`
  # itself, with Vercel's no-installCommand default as the fallback, so deleting that line
  # fails this job with the same ModuleNotFoundError it would serve as a 500 in production.
  deploy-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install exactly what vercel.json's installCommand installs
        run: |
          uv venv
          export VIRTUAL_ENV="$PWD/.venv"
          command=$(python -c "import json; print(json.load(open('vercel.json')).get('installCommand', 'uv pip install .'))")
          echo "installCommand: $command"
          eval "$command"
          uv pip install pytest
      # No --all-extras anywhere above, so UNIPROTPTMPY_EXPECT_EXTRAS does not apply and this
      # job runs one module rather than the suite. REQUIRE_DEPLOY_SURFACE is what makes a
      # missing import a failure here instead of the skip it has to stay elsewhere.
      - name: Import api/index.py and check the files vercel.json promises
        run: .venv/bin/python -m pytest -q tests/test_deploy_surface.py
        env:
          UNIPROTPTMPY_REQUIRE_DEPLOY_SURFACE: "1"
