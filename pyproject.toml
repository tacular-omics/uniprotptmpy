[project]
name = "uniprotptmpy"
dynamic = ["version"]
description = "Python library for parsing and querying the UniProt PTM controlled vocabulary list."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
keywords = ["uniprot", "ptm", "post-translational-modification", "proteomics", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Floors reconciled across psimodpy, unimodpy and uniprotptmpy. fastapi: 0.108.0 is the lowest
# in the contiguous resolving range and 0.100.0 is the lowest that imports (0.104-0.107 cannot
# resolve: they pin anyio<4 against mcp's anyio>=4.9); neither is covered by CI.
server = [
    "fastapi>=0.110.1",
    "uvicorn>=0.31.1",
    "mcp>=2.0.0,<3",
    "pydantic>=2.12,<3",
]
# entry.resolve("psimod" | "unimod").
link = [
    "psimodpy>=1.1,<2",
    "unimodpy>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/uniprotptmpy"
Documentation = "https://github.com/tacular-omics/uniprotptmpy#readme"
Repository = "https://github.com/tacular-omics/uniprotptmpy"
Issues = "https://github.com/tacular-omics/uniprotptmpy/issues"
Changelog = "https://github.com/tacular-omics/uniprotptmpy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: no paper, docs, lockfile or repo tooling.
only-include = [
    "src/uniprotptmpy",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uniprotptmpy"]
artifacts = ["src/uniprotptmpy/data/ptmlist.txt", "src/uniprotptmpy/data/ptmlist.tsv"]

[tool.hatch.version]
path = "src/uniprotptmpy/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "tacular>=2.0,<3",  # tests/test_data_agreement.py only; never a runtime dependency
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/uniprotptmpy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
